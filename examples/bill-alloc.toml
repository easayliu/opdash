# opdash 成本归属规则示例（`--bill-alloc` / `OPDASH_BILL_ALLOC`）
#
# 云账单只能回答「哪个产品花了多少」，无法回答「哪条业务线花了多少」——机器归属于谁、共用服务
# 按何比例分摊，这层知识不在账单之中。本文件将其补足，费用页的「分析」视图据此给出各业务线的
# 金额、日均与月度预估。
#
# 本文件中的名称与地址均为占位示例，请按实际情况改写。真实的规则含有内网地址与业务线命名，
# 属内部信息，**请勿提交至代码仓库**，以 ConfigMap 或挂载卷送入容器即可。
#
# 本文件在进程启动时读取一次，**修改后需重启 opdash（或滚动重启 Pod）方才生效**。
# 配置有误不会被静默接受：格式错误或业务线对不上时，进程将给出原因并退出。

# 业务线。顺序即页面上各行的顺序
lines = ["业务线甲", "业务线乙", "业务线丙", "公共资源"]

# 未命中任何规则的费用归入哪条业务线。省略此项时，这部分单列为「未归属」——
# 无论写与不写，页面都会单独标出未命中的金额，以便知晓尚有多少费用未被规则覆盖
unmatched = "公共资源"

# 只统计命中其中任一条的账单行；整段省略则全部账单均纳入统计。
# 下面的 [prepaid] 已把包年包月挑去摊销那条路，此处不必再写 subscription；
# 若想彻底不看预付费，可去掉 [prepaid] 并在这里写 subscription = ["PayAsYouGo", "按量计费"]
#[[include]]
#subscription = ["PayAsYouGo", "按量计费"]

# 预付费（包年包月）按服务期摊到各月：一台包年的机器在十二个月里各计十二分之一，
# 而不是在购买当月鼓起一大块。整段省略则不做摊销，包年包月按出账当月直接计入。
#
# 这里只说明「哪些账单行算预付费」，归属仍由下面的 [[rules]] 决定；命中的行会自动从
# 「按出账月计入」那条路里排除，不会两头各算一次。
# lookback_months 是往前回溯购买记录的月数：三年前买的三年期机器仍在服务期内，它的摊销
# 仍要计入本月。它只决定回溯多远，不截断服务期，五年期的机器照样摊满五年。
# 服务期按账单的 service_period 换算：一年 12 个月，按天计的除以 30，按秒计的（域名续费）
# 除以 86400 再除以 30，均四舍五入，至少一个月。摊销自购买所在账期起算
[prepaid]
subscription = ["Subscription", "包年包月"]
lookback_months = 36

# 规则自上而下匹配，**命中第一条即停**。因此窄的写在前、宽的写在后：
# 若「ECS 其余部分」置于最前，其后「某几台机器归谁」的规则将永无命中之日。
#
# 一条规则内的各项条件之间是「与」，同一项内的多个取值之间是「或」。
# product / item / region / zone / account / instance / project / subscription / currency
# 这九项是跨云统一的维度，与费用页排行下拉里的那几项同名同义；
# columns 则直接匹配库中的原始列，用于维度无从表达的归属依据。
# 原始列的列名随云而异（阿里云为 intranet_ip，火山引擎没有这一列），
# **某张表缺少该列时，这条规则对那张表整体不生效**，而不会退化为「一律命中」。

# 弹性伸缩组的机器朝生暮死，实例名对不上，只能依命名规律与规格识别。
# 它必须写在「按内网地址识别机器」之前：伸缩组释放的地址会被复用，
# 若先按地址识别，同一笔费用会在两条业务线上各计一次
[[rules]]
name = "业务线丙的弹性伸缩组"
provider = "alicloud"
product = ["云服务器 ECS"]
to = "业务线丙"
columns = [
  { name = "nick_name", like = "app10.0.3.%scale" },
  { name = "instance_spec", any_of = ["ecs.g8a.8xlarge"] },
]

# 一批固定机器按内网地址识别归属
[[rules]]
name = "业务线乙的专用机器"
provider = "alicloud"
product = ["云服务器 ECS"]
to = "业务线乙"
columns = [{ name = "intranet_ip", any_of = ["10.0.1.11", "10.0.1.12", "10.0.1.13"] }]

# 无从识别具体归属的 ECS 按各线的机器数拆分。权重只论相对大小，
# { 甲 = 1, 乙 = 3 } 与 { 甲 = 25, 乙 = 75 } 等价；键含中文时 TOML 要求加引号
[[rules]]
name = "ECS 其余部分按机器数拆分"
product = ["云服务器 ECS"]
split = { "业务线甲" = 130, "业务线乙" = 400, "业务线丙" = 1200 }

# 共用的中间件按固定比例分摊
[[rules]]
name = "消息队列四线均摊"
product = ["云消息队列 MQ"]
split = { "业务线甲" = 1, "业务线乙" = 1, "业务线丙" = 1, "公共资源" = 1 }

# 某条业务线独用的产品，整笔计入该线
[[rules]]
name = "大模型服务"
product = ["大模型服务平台百炼"]
to = "业务线甲"

[[rules]]
name = "语音与存储"
product = ["智能语音交互", "对象存储", "弹性容器实例"]
to = "业务线丙"

# 火山引擎的列名虽然不同，同样可按统一维度书写
[[rules]]
name = "火山引擎的计算资源"
provider = "volcengine"
product = ["云服务器"]
to = "业务线乙"

# 其余产品（负载均衡、块存储、日志服务……）不必逐条书写：
# 未命中规则的一律按上方的 unmatched 归入公共资源
