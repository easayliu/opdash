name: CI

on:
  push:
    branches: [main]
  pull_request:
  # 供 docker.yml 在打 tag 时复用，作为发布前的闸门
  workflow_call:

permissions:
  contents: read

# 同一分支上新的提交会取消掉还在跑的旧任务
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ui / fmt / clippy / test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # 前端先构建：rust-embed 在编译期读取 ui/dist。仓库里留了 .gitkeep，没有产物也能编，
      # 但 CI 要验证的是「打进二进制的那份」，所以先把真实产物构建出来
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - name: Build ui
        working-directory: ui
        run: pnpm install --frozen-lockfile && pnpm build

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # 缓存 ~/.cargo 和 target，第二次起编译只花几十秒
      - uses: Swatinem/rust-cache@v2

      - run: cargo fmt --all --check

      # 一并检查 tests/，不然测试代码烂掉了没人知道
      - run: cargo clippy --all-targets --locked -- -D warnings

      - run: cargo test --all-targets --locked
