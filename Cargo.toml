[package]
name = "opdash"
version = "0.2.4"
edition = "2024"
description = "Trace & log query UI over ClickHouse (logpipe app_log + tracepipe otel_trace)"
license = "MIT"
readme = "README.md"

[dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["http1", "tokio", "json", "query"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "net", "time", "sync"] }
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip", "stream"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "chrono"] }
rust-embed = "8"
mime_guess = "2"
tower-http = { version = "0.6", features = ["compression-gzip", "compression-br", "auth", "trace"] }
thiserror = "2"
chrono = "0.4"
# 直方图桶按 --timezone 的本地日 / 小时边界对齐（ClickHouse 的 toStartOfInterval 按秒数分桶时是对齐 UTC 的）
chrono-tz = "0.10"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
bytes = "1"
parking_lot = "0.12"
humantime = "2"
# 可选的 Basic 认证：解 Authorization 头用。tower-http 自带的 basic() 已标记弃用
base64 = "0.22"
# 自己解 URL 查询串：axum 的 Query 不支持重复的键（attr=k=v 要能给多个），也不方便逐个报清楚哪个参数错
form_urlencoded = "1"
# OIDC 登录（Keycloak）：会话 cookie 的 HMAC、PKCE 的 SHA-256、state / nonce 的随机数。
# ring 本来就随 rustls 在依赖树里，不另拉 hmac / sha2 / rand 三个 crate
ring = "0.17"
# 拼授权 / 登出跳转 URL；reqwest 已经带了
url = "2"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
chrono = "0.4"
form_urlencoded = "1"
serde = { version = "1", features = ["derive"] }

[profile.release]
lto = "thin"
codegen-units = 1
